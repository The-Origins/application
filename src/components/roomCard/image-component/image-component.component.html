<div
  [class]="'image-component' + (fullScreen ? ' full-screen' : '') + ' ' + mode"
  (click)="toggleFullScreen()"
>
  @if(fullScreen){
  <div class="close-button-container">
    <button class="icon-button close-button">
      <mat-icon class="icon">close</mat-icon>
    </button>
  </div>
  }
  <div class="container" (click)="$event.stopPropagation()">
    @if(mode !== 'snippet'){
    <button class="icon-button fullscreen-button" (click)="toggleFullScreen()">
      @if(fullScreen){
      <mat-icon class="icon">close_fullscreen</mat-icon>
      }@else{
      <mat-icon class="icon">fullscreen</mat-icon>
      }
    </button>
    }
    <button class="icon-button carousel-button left" (click)="prev()">
      <mat-icon class="icon">keyboard_arrow_left</mat-icon>
    </button>
    <button class="icon-button carousel-button right" (click)="next()">
      <mat-icon class="icon">keyboard_arrow_right</mat-icon>
    </button>
    <div class="carousel-dots">
      @for (image of images; track image; let i = $index) {
      <div
        [class]="'dot' + (i === imageIndex ? ' active' : '')"
        (click)="setImageIndex(i)"
      ></div>
      }
    </div>
    <div class="carousel-container">
      <div
        class="carousel"
        [style.transform]="`translateX(${imageIndex * -100}%)`"
      >
        @for (image of images; track image; let i = $index) {
        <div class="carousel-item">
          <img [src]="image" [alt]="'room image ' + i" />
        </div>
        }
      </div>
    </div>
  </div>
</div>
