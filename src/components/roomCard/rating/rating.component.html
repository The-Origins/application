<div class="rating-container">
  @for (i of [1, 2, 3, 4, 5]; track i) {
  <div class="rating-star">
    <img
      [src]="
        i <= rating
          ? 'assets/star.png'
          : i <= rating + 1
          ? 'assets/star-half.png'
          : 'assets/star-empty.png'
      "
      alt="rating star"
    />
  </div>
  }
</div>
